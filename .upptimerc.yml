owner: barangaroo
repo: crosstabs-status

assignees:
  - barangaroo

sites:
  - name: Crosstabs API health
    url: https://www.crosstabs.com/api/health
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200

status-website:
  baseUrl: /crosstabs-status
  logoUrl: https://www.crosstabs.com/icon
  name: Crosstabs status
  introTitle: "Independent uptime history for **Crosstabs**"
  introMessage: This public monitor runs on GitHub infrastructure and probes the production health endpoint every five minutes. It contains operational metadata only—never respondent data.
  navbar:
    - title: Status
      href: /crosstabs-status
    - title: Crosstabs
      href: https://www.crosstabs.com
    - title: Evidence repository
      href: https://github.com/barangaroo/crosstabs-status

