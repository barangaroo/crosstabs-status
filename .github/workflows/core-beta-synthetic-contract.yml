name: Core beta synthetic contract

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/core-beta-synthetic.yml"
      - ".github/workflows/core-beta-synthetic-contract.yml"
      - "synthetic/**"
  workflow_dispatch:

permissions: {}

jobs:
  contract:
    name: Verify locked monitor contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: synthetic/package-lock.json

      - name: Install isolated locked monitor
        run: npm ci --ignore-scripts --prefix synthetic

      - name: Verify monitor contracts
        run: npm test --prefix synthetic

      - name: Discover the exact browser journey
        run: >-
          ./synthetic/node_modules/.bin/playwright test --list
          --config=synthetic/playwright.config.ts
